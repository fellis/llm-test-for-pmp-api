# GPU modes (one at a time on the same GPU):
#   LLM:       ./scripts/start.sh <profile>     (profiles: llm)
#   Embedding: ./scripts/start-embedding.sh     (profile: embedding)
# Models cache: ./models (Hugging Face). Run: ./scripts/status.sh

services:
  llm:
    profiles: ["llm"]
    build: ./llm
    image: llm-backend
    container_name: llm-backend
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_PROFILE=${MODEL_PROFILE:-coding}
      - CONFIG_PATH=/config/models.json
    volumes:
      - ./models:/root/.cache/huggingface
      - ./config:/config:ro
    ports:
      - "8002:8002"
    shm_size: "8gb"
    restart: unless-stopped

  api:
    profiles: ["llm"]
    build: ./api
    container_name: llm-api
    ports:
      - "8000:8000"
    environment:
      - BACKEND_URL=http://llm:8002
      - BACKEND_MODEL_ID=${BACKEND_MODEL_ID:-Qwen/Qwen2.5-Coder-14B-Instruct-AWQ}
    # Optional: mount auth.json for Bearer token auth
    # volumes:
    #   - ./auth.json:/app/auth.json
    restart: unless-stopped
    depends_on:
      - llm

  phase2-embedding-worker:
    profiles: ["embedding"]
    build:
      context: ./phase2-embedding-worker
      dockerfile: Dockerfile.gpu
    image: phase2-embedding-worker-gpu
    container_name: phase2-embedding-worker
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - EMBEDDING_DEVICE=cuda
      - EMBEDDING_ENCODE_BATCH_SIZE=32
      - EMBEDDING_MAX_INFLIGHT=${EMBEDDING_MAX_INFLIGHT:-20}
      - EMBEDDING_MAX_CHARS_PER_TEXT=28000
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ./models:/root/.cache/huggingface
    ports:
      - "8090:8090"
    shm_size: "4gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 300s

  # MADLAD-400 translation (CPU). Optional; not part of llm/embedding GPU switch.
  translator:
    build: ./translator
    container_name: translator
    ports:
      - "6340:6340"
    volumes:
      - translator_models:/models
    environment:
      - MODEL_ID=cstr/madlad400-3b-ct2-int8
      - MODEL_DIR=/models/madlad400-3b-ct2-int8
      - INTER_THREADS=4
      - INTRA_THREADS=16
    privileged: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6340/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  translator_models:
